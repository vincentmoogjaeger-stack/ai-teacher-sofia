<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Sofia — Prof de français IA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 🎨 STYLE -->
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      width: 420px;
      max-width: 90%;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 20px;
    }

    /* 👤 AVATAR */
    .avatar-wrapper {
      margin: 16px auto;
      width: 120px;
      height: 120px;
    }

    #avatar {
      width: 100%;
      height: 100%;
      transition: transform 0.15s ease-in-out;
    }

    /* 👄 Animation lèvres */
    #avatar.talking {
      animation: talk 0.18s infinite alternate;
    }

    @keyframes talk {
      from { transform: scaleY(1); }
      to   { transform: scaleY(0.94); }
    }

    /* 💬 CONVERSATION */
    #conversation {
      margin-top: 16px;
      text-align: left;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }

    #conversation p {
      margin: 6px 0;
      font-size: 0.95rem;
      line-height: 1.35;
    }

    #conversation strong {
      color: #4f46e5;
    }

    /* 🎙️ BOUTON */
    #record {
      margin-top: 18px;
      padding: 14px 22px;
      border-radius: 999px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      background: #6366f1;
      color: white;
      transition: background 0.2s ease;
    }

    #record:hover {
      background: #4f46e5;
    }

    #record:disabled {
      background: #a5b4fc;
      cursor: not-allowed;
    }

    /* 🔊 AUDIO */
    audio {
      width: 100%;
      margin-top: 14px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Sofia — Prof de français IA</h1>
    <p class="subtitle">Converse avec moi, ne sois pas timide.</p>

    <div class="avatar-wrapper">
      <img id="avatar" src="AvatarSofia.svg" alt="Avatar Sofia" />
    </div>

    <!-- 💬 CONVERSATION -->
    <div id="conversation">
      <p><em>Bonjour, je suis Sofia 🙂 Appuie sur “Parler” et discutons !</em></p>
    </div>

    <!-- 🎙️ BOUTON -->
    <button id="record">🎙️ Parler</button>

    <!-- 🔊 AUDIO -->
    <audio id="audio" controls></audio>
  </div>

  <!-- 📜 SCRIPT -->
  <script src="script.js"></script>
</body>
</html>
